# Builds the port (haxe.Main compiled to C by hxc) for Linux, macOS and
# Windows (x86_64, aarch64) with zig cc, and as a Cosmopolitan APE binary,
# each with mbedtls and libuv linked statically (`make release`, `make cosmo`,
# the Makefile). The Windows builds are native (MinGW-w64, the UCRT; the
# runtime's Windows host layer, hxc/rt/rt_win.h): Sys.systemName() is
# "Windows" and paths, processes and the environment are Windows' own, as with
# the reference haxe.exe. Tests each on a native runner (hxc/tools/smoke.sh,
# TLS and libuv included) and publishes them: a rolling `nightly` pre-release
# on pushes to main, a release on v* tags.
# Also builds lix (tools/lix) as a Cosmopolitan binary, lix.com (`make
# lix-cosmo`), and the website (`make site`: the playground's WebAssembly with
# Emscripten, the pages' JavaScript compiled from Haxe by the Linux build of
# the port, lix.com under tools/) and deploys it to GitHub Pages on pushes to main.
# Runs upstream Haxe's CI test suite with the release binaries as haxe
# (upstream-tests.yml).
#
# Release assets (https://github.com/<repo>/releases/download/<tag>/<asset>):
#   haxe-in-haxe-linux-x86_64.tar.gz   haxe-in-haxe-linux-aarch64.tar.gz
#   haxe-in-haxe-macos-x86_64.tar.gz   haxe-in-haxe-macos-aarch64.tar.gz
#   haxe-in-haxe-windows-x86_64.zip    haxe-in-haxe-windows-aarch64.zip (haxe-in-haxe.exe)
#   haxe-in-haxe.com                   (the APE binary, std embedded)
#   haxe-in-haxe-licenses.zip          (the licenses of haxe-in-haxe.com)
name: build

on:
  push:
    branches: [main, ci-zig]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  OCAML_VERSION: 5.3.0
  ZIG_VERSION: 0.17.0
  COSMOCC_VERSION: 4.0.2
  HXNODEJS_COMMIT: 8aff897563076d607e6a4d0d6287adb7724c6273
  EMSCRIPTEN_VERSION: 6.0.12

jobs:
  # the reference compiler (built from the haxe/ submodule) and the port's C
  generate:
    runs-on: ubuntu-24.04
    env:
      OPAMYES: 1
      PLATFORM: linux64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Reference compiler revision
        id: ref
        run: echo "rev=$(git -C haxe rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache the reference compiler
        id: cache-haxe
        uses: actions/cache@v6
        with:
          path: haxe/haxe
          key: haxe-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-${{ steps.ref.outputs.rev }}

      - name: System packages
        run: |
          sudo apt-get update -qqy
          sudo apt-get install -qqy opam libpcre2-dev zlib1g-dev libmbedtls-dev ninja-build

      - name: Cache opam
        if: steps.cache-haxe.outputs.cache-hit != 'true'
        id: cache-opam
        uses: actions/cache@v6
        with:
          path: ~/.opam/
          key: opam-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-${{ hashFiles('haxe/haxe.opam') }}

      - name: Neko (for the opam package conf-neko)
        if: steps.cache-haxe.outputs.cache-hit != 'true' && steps.cache-opam.outputs.cache-hit != 'true'
        uses: ./haxe/.github/actions/setup-neko

      - name: OCaml libraries
        if: steps.cache-haxe.outputs.cache-hit != 'true' && steps.cache-opam.outputs.cache-hit != 'true'
        run: |
          set -ex
          opam init -c "$OCAML_VERSION" --disable-sandboxing
          opam pin add haxe ./haxe --no-action
          opam install haxe --deps-only --assume-depexts
          opam list

      - name: Build the reference compiler
        if: steps.cache-haxe.outputs.cache-hit != 'true'
        run: |
          set -ex
          eval $(opam env)
          make -C haxe -s -j"$(nproc)" haxe

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: hxnodejs
        run: |
          git init -q "$RUNNER_TEMP/hxnodejs"
          git -C "$RUNNER_TEMP/hxnodejs" fetch -q --depth 1 https://github.com/HaxeFoundation/hxnodejs "$HXNODEJS_COMMIT"
          git -C "$RUNNER_TEMP/hxnodejs" checkout -q FETCH_HEAD

      # the port's C, and the playground's (without the target generators)
      - name: Generate the port's C
        run: |
          set -ex
          haxe/haxe --version
          make port-c web-c TOOL_LIBS="$RUNNER_TEMP/hxnodejs/extraParams.hxml -cp $RUNNER_TEMP/hxnodejs/src"
          ls bin/hxc/hih/prog_hxc | wc -l
          du -sh bin/hxc/hih/prog_hxc bin/hxc/hih-web/prog_hxc

      # lix's C (tools/lix, with hxcoro fetched at its pinned commit)
      - name: Generate lix's C
        run: |
          set -ex
          make lix-c TOOL_LIBS="$RUNNER_TEMP/hxnodejs/extraParams.hxml -cp $RUNNER_TEMP/hxnodejs/src"
          ls bin/lix/lix_hxc | wc -l

      - name: Pack the C and the std
        run: |
          set -ex
          mkdir -p dist dist-web dist-lix
          tar czf dist/port-c.tar.gz -C bin/hxc/hih prog_hxc
          tar czf dist/std.tar.gz -C haxe std
          tar czf dist-web/port-c-web.tar.gz -C bin/hxc/hih-web prog_hxc
          tar czf dist-lix/lix-c.tar.gz -C bin/lix lix_hxc

      - uses: actions/upload-artifact@v7
        with:
          name: port-c
          path: dist/
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: port-c-web
          path: dist-web/
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: lix-c
          path: dist-lix/
          retention-days: 7

  # zig cc cross builds from Linux, one target per job, with mbedtls and libuv
  # built for the target (hxc/tools/deps.sh, cached)
  build:
    needs: generate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-linux-gnu.2.28
          - name: linux-aarch64
            target: aarch64-linux-gnu.2.28
          - name: macos-x86_64
            target: x86_64-macos
          - name: macos-aarch64
            target: aarch64-macos
          - name: windows-x86_64
            target: x86_64-windows-gnu
            exe: .exe
          - name: windows-aarch64
            target: aarch64-windows-gnu
            exe: .exe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: port-c
          path: dist
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Cache mbedtls and libuv
        uses: actions/cache@v6
        with:
          path: bin/deps/${{ matrix.target }}
          key: deps-${{ matrix.target }}-zig-${{ env.ZIG_VERSION }}-${{ hashFiles('hxc/tools/deps.sh') }}
      - name: Compile
        run: |
          set -ex
          mkdir -p dist/c
          tar xzf dist/port-c.tar.gz -C dist/c
          make release TARGET=${{ matrix.target }} PORT_C=dist/c/prog_hxc
          file bin/release/${{ matrix.target }}/haxe-in-haxe${{ matrix.exe }}
      - name: Package
        run: |
          set -ex
          P=haxe-in-haxe-${{ matrix.name }}
          D=bin/deps/${{ matrix.target }}
          mkdir -p "pkg/$P"
          cp bin/release/${{ matrix.target }}/haxe-in-haxe${{ matrix.exe }} LICENSE COPYING $D/LICENSE.mbedtls $D/LICENSE.libuv "pkg/$P/"
          tar xzf dist/std.tar.gz -C "pkg/$P"
          if [ -n "${{ matrix.exe }}" ]; then
            cat > "pkg/$P/README.txt" <<EOF
          haxe-in-haxe: the Haxe compiler ported to Haxe, compiled to C (https://github.com/${{ github.repository }}).
          Commit ${{ github.sha }}, target ${{ matrix.target }} (built with zig cc, with mbedtls and libuv).

          Use it like haxe.exe, with HAXE_STD_PATH pointing at the std directory next to it:
            set HAXE_STD_PATH=%CD%\std
            haxe-in-haxe.exe -main Main --interp
          EOF
            (cd pkg && zip -qr -9 "../$P.zip" "$P")
            ls -l "$P.zip"
          else
            cat > "pkg/$P/README.txt" <<EOF
          haxe-in-haxe: the Haxe compiler ported to Haxe, compiled to C (https://github.com/${{ github.repository }}).
          Commit ${{ github.sha }}, target ${{ matrix.target }} (built with zig cc, with mbedtls and libuv).

          Use it like haxe, with HAXE_STD_PATH pointing at the std directory next to it:
            export HAXE_STD_PATH=\$PWD/std
            ./haxe-in-haxe -main Main --interp
          macOS: a browser download is quarantined; xattr -d com.apple.quarantine haxe-in-haxe
          EOF
            tar czf "$P.tar.gz" -C pkg "$P"
            ls -l "$P.tar.gz"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: haxe-in-haxe-${{ matrix.name }}
          path: haxe-in-haxe-${{ matrix.name }}.${{ matrix.exe && 'zip' || 'tar.gz' }}
          retention-days: 14

  # the Cosmopolitan APE binary (Linux, macOS, Windows, BSDs), with mbedtls and
  # libuv: haxe-in-haxe.com, not the Windows release (its Eval host sees a POSIX
  # system on Windows: Sys.systemName() "Linux", /C/... paths)
  cosmo:
    needs: generate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: port-c
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: lix-c
          path: dist
      - name: Cache cosmocc
        id: cache-cosmocc
        uses: actions/cache@v6
        with:
          path: ~/cosmocc
          key: cosmocc-${{ env.COSMOCC_VERSION }}
      - name: Install cosmocc
        if: steps.cache-cosmocc.outputs.cache-hit != 'true'
        run: |
          set -ex
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/cosmocc.zip" "https://github.com/jart/cosmopolitan/releases/download/$COSMOCC_VERSION/cosmocc-$COSMOCC_VERSION.zip"
          mkdir -p ~/cosmocc
          unzip -q "$RUNNER_TEMP/cosmocc.zip" -d ~/cosmocc
      - name: APE loader
        run: |
          # run APE tools directly (not through binfmt_misc handlers such as WINE's)
          sudo cp ~/cosmocc/bin/ape-x86_64.elf /usr/bin/ape
          sudo sh -c "echo ':APE:M::MZqFpD::/usr/bin/ape:' > /proc/sys/fs/binfmt_misc/register" || true
          sudo sh -c "echo ':APE-jart:M::jartsr::/usr/bin/ape:' > /proc/sys/fs/binfmt_misc/register" || true
          echo "$HOME/cosmocc/bin" >> "$GITHUB_PATH"
      - name: Cache mbedtls and libuv
        uses: actions/cache@v6
        with:
          path: bin/deps/cosmo
          key: deps-cosmo-${{ env.COSMOCC_VERSION }}-${{ hashFiles('hxc/tools/deps.sh', 'hxc/tools/cosmo-patches/*') }}
      - name: Compile
        run: |
          set -ex
          cosmocc --version
          mkdir -p dist/c
          tar xzf dist/port-c.tar.gz -C dist/c
          make cosmo PORT_C=dist/c/prog_hxc
      - name: Package
        run: |
          set -ex
          mkdir -p pkg/std-zip out
          tar xzf dist/std.tar.gz -C pkg/std-zip
          # the std in the binary's own zip (rt.c reads /zip/std when HAXE_STD_PATH is unset)
          cp bin/release/cosmo/haxe-in-haxe.com out/haxe-in-haxe.com
          (cd pkg/std-zip && zip -qr -9 ../../out/haxe-in-haxe.com std)
          mkdir -p pkg/licenses
          cp LICENSE COPYING bin/deps/cosmo/LICENSE.mbedtls bin/deps/cosmo/LICENSE.libuv pkg/licenses/
          (cd pkg/licenses && zip -q -9 ../../out/haxe-in-haxe-licenses.zip *)
          ls -l out
      - uses: actions/upload-artifact@v7
        with:
          name: haxe-in-haxe-cosmo
          path: out/
          retention-days: 14
      - name: lix.com
        run: |
          set -ex
          mkdir -p dist/lix
          tar xzf dist/lix-c.tar.gz -C dist/lix
          make lix-cosmo LIX_C=dist/lix/lix_hxc
          mkdir -p lix-out
          cp bin/release/cosmo/lix.com lix-out/
          # one binary for four commands: lix, and haxe through a link
          lix-out/lix.com --version
          ln -s lix.com lix-out/haxe
          export HAXESHIM_ROOT="$RUNNER_TEMP/lix-root"
          mkdir -p "$RUNNER_TEMP/lix-project" && cd "$RUNNER_TEMP/lix-project"
          "$GITHUB_WORKSPACE/lix-out/lix.com" scope create
          "$GITHUB_WORKSPACE/lix-out/lix.com" install haxelib:tink_core
          "$GITHUB_WORKSPACE/lix-out/lix.com" install haxe 4.3.7
          "$GITHUB_WORKSPACE/lix-out/haxe" --run resolve-args -lib tink_core
          "$GITHUB_WORKSPACE/lix-out/haxe" -version
      - uses: actions/upload-artifact@v7
        with:
          name: lix-cosmo
          path: lix-out/lix.com
          retention-days: 14

  test:
    needs: [build, cosmo]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            pkg: linux-x86_64
          - os: ubuntu-24.04-arm
            pkg: linux-aarch64
          - os: macos-15-intel
            pkg: macos-x86_64
          - os: macos-latest
            pkg: macos-aarch64
          - os: windows-latest
            pkg: windows-x86_64
          - os: windows-11-arm
            pkg: windows-aarch64
          - os: ubuntu-24.04
            pkg: com
          - os: macos-latest
            pkg: com
          - os: windows-latest
            pkg: com
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-11-arm' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: hxc/tools
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.pkg == 'com' && 'haxe-in-haxe-cosmo' || format('haxe-in-haxe-{0}', matrix.pkg) }}
          path: dl
      - name: Unpack
        id: unpack
        run: |
          set -ex
          case "${{ matrix.pkg }}" in
            com)
              # Windows runs it under an .exe name
              B=haxe-in-haxe.com
              if [ "$RUNNER_OS" = Windows ]; then B=haxe-in-haxe.exe; fi
              mkdir -p t && cp dl/haxe-in-haxe.com "t/$B" && chmod +x "t/$B"
              echo "bin=$PWD/t/$B" >> "$GITHUB_OUTPUT"
              echo "std=" >> "$GITHUB_OUTPUT" ;;
            windows-*)
              unzip -q dl/haxe-in-haxe-${{ matrix.pkg }}.zip -d t
              echo "bin=$PWD/t/haxe-in-haxe-${{ matrix.pkg }}/haxe-in-haxe.exe" >> "$GITHUB_OUTPUT"
              # a Windows path (C:/...) for the native program
              echo "std=$(cygpath -m "$PWD/t/haxe-in-haxe-${{ matrix.pkg }}/std")" >> "$GITHUB_OUTPUT" ;;
            *)
              mkdir -p t && tar xzf dl/haxe-in-haxe-${{ matrix.pkg }}.tar.gz -C t
              echo "bin=$PWD/t/haxe-in-haxe-${{ matrix.pkg }}/haxe-in-haxe" >> "$GITHUB_OUTPUT"
              echo "std=$PWD/t/haxe-in-haxe-${{ matrix.pkg }}/std" >> "$GITHUB_OUTPUT" ;;
          esac
          ls -l t t/*
      - name: Smoke test
        run: |
          if [ -n "${{ steps.unpack.outputs.std }}" ]; then export HAXE_STD_PATH="${{ steps.unpack.outputs.std }}"; fi
          SMOKE_DIR="$RUNNER_TEMP/smoke" sh hxc/tools/smoke.sh "${{ steps.unpack.outputs.bin }}"
      - uses: actions/download-artifact@v8
        if: matrix.pkg == 'com' || startsWith(matrix.pkg, 'windows')
        with:
          name: lix-cosmo
          path: lix
      - name: lix.com
        if: matrix.pkg == 'com' || startsWith(matrix.pkg, 'windows')
        # lix on Windows (Cosmopolitan's libuv, Windows programs, cmd.exe for hooks) is new
        continue-on-error: ${{ runner.os == 'Windows' }}
        run: |
          set -ex
          if [ "$RUNNER_OS" = Windows ]; then L=lix/lix.exe; mv lix/lix.com "$L"; else L=lix/lix.com; chmod +x "$L"; fi
          L="$PWD/$L"
          "$L" --version
          # the haxe shim: the same binary under that name (lix shims: links next to it)
          "$L" shims
          ls -l lix
          # installed as on a user's machine: the commands on PATH (the libraries' install commands call lix)
          export PATH="$PWD/lix:$PATH"
          if [ "$RUNNER_OS" = Windows ]; then H=lix/haxe.exe; else H=lix/haxe; fi
          H="$PWD/$H"
          export HAXESHIM_ROOT="$RUNNER_TEMP/lix-root"
          mkdir -p "$RUNNER_TEMP/lix-project/src" && cd "$RUNNER_TEMP/lix-project"
          "$L" scope create
          "$L" download
          "$L" install haxelib:tink_core
          cat haxe_libraries/tink_core.hxml .haxerc
          # a fresh clone's case: the libraries reinstalled from haxe_libraries (in parallel)
          "$L" install haxelib:tink_json
          rm -rf "$HAXESHIM_ROOT/haxe_libraries"
          "$L" download
          echo 'class Main { static function main() trace(tink.core.Outcome.Success(#if sys Sys.args() #else "js" #end)); }' > src/Main.hx
          "$H" -version
          "$H" --run resolve-args -lib tink_core
          "$H" --run resolve-args -lib tink_json
          "$H" -cp src -lib tink_core --run Main a b
          "$H" -cp src -lib tink_core -main Main --js main.js && node main.js
      - name: Smoke test (PowerShell, Windows paths)
        if: startsWith(matrix.pkg, 'windows')
        shell: pwsh
        run: |
          $env:HAXE_STD_PATH = (Resolve-Path "t/haxe-in-haxe-${{ matrix.pkg }}/std").Path
          $exe = (Resolve-Path "t/haxe-in-haxe-${{ matrix.pkg }}/haxe-in-haxe.exe").Path
          New-Item -ItemType Directory -Force ps | Out-Null
          Set-Location ps
          Set-Content Main.hx 'class Main { static function main() { trace("hello from " + #if sys Sys.systemName() + " in " + Sys.getCwd() #else "js" #end); } }'
          $out = & $exe -main Main --interp
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $out
          # the native build's Eval host: Windows, with a drive letter
          if (-not ($out -match "hello from Windows in [A-Z]:\\")) { exit 1 }
          & $exe -main Main --js out.js
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node out.js
          & $exe -cp . -main Main --hxb out.hxb
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item out.hxb

  # upstream Haxe's CI test suite (RunCi for every target) with the release
  # binaries as haxe (upstream-tests.yml); not required by the release
  upstream-tests:
    needs: [build, cosmo]
    uses: ./.github/workflows/upstream-tests.yml

  # nightly on main, a release on v* tags
  release:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: haxe-in-haxe-*
          path: assets
          merge-multiple: true
      - name: Publish
        run: |
          set -ex
          ls -l assets
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-9)
          NOTES="Built from $GITHUB_SHA.

          - haxe-in-haxe-<os>-<arch>.tar.gz: Linux and macOS builds (zig cc, with mbedtls and libuv), with std/; set HAXE_STD_PATH to it.
          - haxe-in-haxe-windows-<arch>.zip: Windows builds (zig cc, MinGW-w64 and the UCRT, with mbedtls and libuv) as haxe-in-haxe.exe, with std/; set HAXE_STD_PATH to it.
          - haxe-in-haxe.com: a Cosmopolitan binary for Linux, macOS, Windows and the BSDs, with the std embedded. Its licenses (LICENSE, COPYING, LICENSE.mbedtls, LICENSE.libuv) are in haxe-in-haxe-licenses.zip; every archive carries its own."
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG=$GITHUB_REF_NAME
            gh release create "$TAG" --verify-tag --title "haxe-in-haxe $TAG" --notes "$NOTES" assets/*
          else
            TAG=nightly
            if gh release view "$TAG" > /dev/null 2>&1; then
              # move the tag, then replace the assets in place (the download URLs stay valid)
              gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true
              gh release upload "$TAG" assets/* --clobber
              gh release edit "$TAG" --prerelease --title "Nightly ($SHORT)" --notes "$NOTES"
            else
              gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "Nightly ($SHORT)" --notes "$NOTES" assets/*
            fi
          fi

  # the website (`make site`): WebAssembly playground (Emscripten) and the
  # pages' JavaScript, compiled from site/src by the Linux build of the port
  site:
    needs: [generate, build, cosmo]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: port-c
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: port-c-web
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: haxe-in-haxe-linux-x86_64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: lix-cosmo
          path: dist/lix
      - name: Cache Emscripten
        id: cache-emsdk
        uses: actions/cache@v6
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSCRIPTEN_VERSION }}
      - name: Install Emscripten
        if: steps.cache-emsdk.outputs.cache-hit != 'true'
        run: |
          set -ex
          git clone -q --depth 1 https://github.com/emscripten-core/emsdk ~/emsdk
          ~/emsdk/emsdk install "$EMSCRIPTEN_VERSION"
          ~/emsdk/emsdk activate "$EMSCRIPTEN_VERSION"
      - name: Build the site
        run: |
          set -ex
          mkdir -p dist/web haxe
          tar xzf dist/port-c-web.tar.gz -C dist/web
          tar xzf dist/std.tar.gz -C haxe
          tar xzf dist/haxe-in-haxe-linux-x86_64.tar.gz -C dist
          . ~/emsdk/emsdk_env.sh
          make site WEB_C=dist/web/prog_hxc SITE_HAXE="$PWD/dist/haxe-in-haxe-linux-x86_64/haxe-in-haxe" LIX_COM=dist/lix/lix.com
          ls -l bin/site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: bin/site

  pages:
    needs: site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
